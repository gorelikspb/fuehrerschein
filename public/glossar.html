  <script type="application/ld+json" class="seo-de">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Was ist der Unterschied zwischen Vorfahrt und Vorrang?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Vorfahrt regelt die Reihenfolge an Kreuzungen und Einmündungen bei sich kreuzenden Fahrwegen. Vorrang gilt im Längsverkehr ohne Kreuzung, zum Beispiel an Engstellen, vor Fußgängerüberwegen oder beim Anfahren."
        }
      },
      {
        "@type": "Question",
        "name": "Was bedeutet Reißverschlussverfahren?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Endet ein Fahrstreifen oder ist ein Streifen blockiert, fahren die Fahrzeuge erst unmittelbar vor der Engstelle abwechselnd wie bei einem Reißverschluss (ein Fahrzeug links, ein Fahrzeug rechts) zusammen."
        }
      }
    ]
  }
  </script>

<body>
  <header class="app-header">
    <div class="container header-row">
      <div>
        <a id="back-link" class="back-link" href="index.html">← Alle Themen</a>

        <p id="page-subtitle">24 wichtige Fachbegriffe für Theorieprüfung & Fahrstunden</p>
      </div>

  <main class="container">
    <p class="source-notice" data-source-notice></p>

    <section class="card">
      <label for="glossar-filter" id="filter-label" style="display:block;font-weight:600;margin-bottom:0.4rem;">Begriff suchen:</label>
      <input id="glossar-filter" type="search" placeholder="z. B. Vorfahrt, Schulterblick, Promille..." style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:8px;font-size:1rem;">
    </section>

    <section class="card">
      <div style="overflow-x:auto;">
        <table class="formulas-table" id="glossar-table">
          <thead>
            <tr>
              <th id="th-de">Deutsch</th>
              <th id="th-ru">Русский перевод</th>
              <th id="th-desc">Erklärung / Значение</th>
            </tr>
          </thead>
          <tbody id="glossar-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="btn-row">
        <a id="cta-vorfahrt" class="btn btn-primary" href="topic.html?id=1-3-vorfahrt-vorrang">Vorfahrt & Vorrang üben</a>
        <a id="cta-zeichen" class="btn btn-secondary" href="topic.html?id=1-4-verkehrszeichen">Verkehrszeichen üben</a>
        <a id="cta-formulas" class="btn btn-secondary" href="formulas.html">Formeln & Rechner</a>
      </div>

  </main>

  <footer class="site-footer">
    <p id="footer-time" class="footer-time"></p>
    <button type="button" id="time-reset-btn" class="footer-link-btn"></button>
    <p class="footer-feedback"><a id="footer-feedback-link" href="mailto:gorelikgo@gmail.com?subject=Feedback:%20Fuehrerschein">Feedback / Fehler melden</a></p>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/time-tracker.js"></script>
  <script>
    const TERMS = [
      { de: "Vorfahrt", ru: "Право проезда перекрёстка (главная дорога)", descDe: "Reihenfolge an Kreuzungen und Einmündungen.", descRu: "Очерёдность проезда перекрёстков и примыканий." },
      { de: "Vorrang", ru: "Преимущество в движении (не на перекрёстке)", descDe: "Recht auf Durchfahrt bei Engstellen, Fußgängerüberwegen etc.", descRu: "Преимущество при сужении дороги, перед пешеходным переходом и т.д." },
      { de: "Rechts vor Links", ru: "Помеха справа", descDe: "Ohne Schilder/Ampel hat der von rechts Kommende Vorfahrt.", descRu: "На равнозначном перекрёстке уступают транспорту справа." },
      { de: "Abknickende Vorfahrt", ru: "Направление главной дороги", descDe: "Zusatzzeichen zeigt den Verlauf der Vorfahrtstraße; beim Folgen blinken!", descRu: "Главная дорога меняет направление; при следовании по ней нужно включать поворотник!" },
      { de: "Schulterblick", ru: "Взгляд через плечо (проверка мёртвой зоны)", descDe: "Blick über die Schulter vor Abbiegen, Spurwechsel und Aussteigen.", descRu: "Обязательный взгляд через плечо перед манёвром и открытием двери." },
      { de: "Toter Winkel", ru: "Слепая / мёртвая зона", descDe: "Bereich neben dem Fahrzeug, der im Spiegel nicht sichtbar ist.", descRu: "Зона сбоку/сзади автомобиля, не видимая в зеркала." },
      { de: "Reißverschlussverfahren", ru: "Правило «застёжки-молнии»", descDe: "Abwechselndes Einfädeln erst unmittelbar vor einer Fahrstreifen-Engstelle.", descRu: "Поочерёдное перестроение (1+1) непосредственно перед сужением полосы." },
      { de: "Rettungsgasse", ru: "Коридор для экстренных служб", descDe: "Bei Stau auf Autobahnen zwischen ganz linker und rechter Spur bilden.", descRu: "При заторе на автобане: левый ряд прижимается левее, остальные — правее." },
      { de: "Richtgeschwindigkeit", ru: "Рекомендуемая скорость (130 км/ч)", descDe: "Empfohlene Höchstgeschwindigkeit auf Autobahnen ohne Tempolimit.", descRu: "Рекомендуемая скорость на автобане без знака ограничения." },
      { de: "Schrittgeschwindigkeit", ru: "Скорость пешехода (ок. 4–7 км/ч)", descDe: "Vorgeschrieben in verkehrsberuhigten Bereichen und beim Vorbeifahren an haltenden Bussen mit Warnblinklicht.", descRu: "Обязательна в жилой зоне (Spielstraße) и мимо автобуса с аварийкой." },
      { de: "Verkehrsberuhigter Bereich", ru: "Жилая зона (знак 325.1)", descDe: "Fußgänger haben Vorrang, Schrittgeschwindigkeit, Parken nur in markierten Flächen.", descRu: "Пешеходы имеют преимущество, скорость шага, парковка только в разметке." },
      { de: "Haltverbot (absolut / eingeschränkt)", ru: "Запрет остановки / стоянки", descDe: "Absolut (Zeichen 283): gar nicht halten. Eingeschränkt (286): max. 3 Min. oder Be-/Entladen.", descRu: "Знак 283 — даже остановка запрещена; знак 286 — до 3 минут или посадка/выгрузка." },
      { de: "Seitenabstand", ru: "Боковой интервал", descDe: "Mindestens 1,5 m innerorts und 2,0 m außerorts zu Radfahrern und Fußgängern.", descRu: "При обгоне велосипедистов/пешеходов: ≥1,5 м в городе, ≥2,0 м за городом." },
      { de: "Halber Tacho", ru: "«Половина спидометра» (дистанция)", descDe: "Mindestabstand außerorts in Metern = halbe Geschwindigkeit in km/h.", descRu: "Дистанция за городом в метрах = половина скорости в км/ч (100 км/ч → 50 м)." },
      { de: "Reaktionsweg", ru: "Путь реакции", descDe: "Strecke während 1 Sekunde Reaktion: (km/h ÷ 10) × 3.", descRu: "Расстояние за 1 секунду до нажатия тормоза: (скорость ÷ 10) × 3." },
      { de: "Bremsweg", ru: "Тормозной путь", descDe: "Strecke ab Bremsbeginn: (km/h ÷ 10)² (Gefahrenbremsung: ÷ 2).", descRu: "Путь с момента нажатия тормоза: (скорость ÷ 10)² (экстренное: ÷ 2)." },
      { de: "Anhalteweg", ru: "Остановочный путь", descDe: "Reaktionsweg + Bremsweg bis zum Stillstand.", descRu: "Полный путь до остановки = путь реакции + тормозной путь." },
      { de: "Andreaskreuz", ru: "Андреевский крест (ж/д переезд)", descDe: "Schienenfahrzeuge haben Vorrang; Parkverbot 5 m innerorts, 50 m außerorts.", descRu: "Рельсовый транспорт имеет приоритет; парковка запрещена за 5 м (город) / 50 м (трасса)." },
      { de: "Nebelschlussleuchte", ru: "Задний противотуманный фонарь", descDe: "Darf nur bei Sichtweite unter 50 m eingeschaltet werden (dann max. 50 km/h).", descRu: "Включается только при видимости < 50 м (макс. скорость тогда 50 км/ч)." },
      { de: "Aquaplaning", ru: "Аквапланирование", descDe: "Wasserkeil unter den Reifen: kein Lenken, kein starkes Bremsen, Fuß vom Gas.", descRu: "Водяной клин под шинами: не крутить руль, не жать резко тормоз, сбросить газ." },
      { de: "Innerorts / Außerorts", ru: "В населённом пункте / вне его", descDe: "Ortstafel (gelbes Schild) trennt innerorts (meist 50 km/h) und außerorts (meist 100 km/h).", descRu: "Жёлтый знак города разделяет город (обычно 50) и загородную дорогу (обычно 100)." },
      { de: "Promillegrenze", ru: "Допустимый уровень алкоголя", descDe: "0,0 ‰ in der Probezeit und unter 21 Jahren; sonst 0,5 ‰ (ab 0,3 ‰ bei Ausfallerscheinungen strafbar).", descRu: "0,0 ‰ на испытательном сроке и до 21 года; иначе 0,5 ‰ (или 0,3 ‰ при нарушениях)." },
      { de: "Probezeit", ru: "Испытательный срок (2 года)", descDe: "Erste 2 Jahre nach Ersterteilung: 0,0 ‰ Alkohol und strengere Folgen bei A-/B-Verstößen.", descRu: "Первые 2 года после получения первых прав: 0,0 ‰ и строгие санкции за нарушения." },
      { de: "Umweltzone", ru: "Экологическая зона", descDe: "Einfahrt nur mit passender Umweltplakette (meist grün).", descRu: "Въезд разрешён только с соответствующей экологической наклейкой (обычно зелёной)." }
    ];

    function renderTerms(filter) {
      const lang = getLang();
      const q = (filter || "").trim().toLowerCase();
      const tbody = document.getElementById("glossar-body");
      if (!tbody) return;
      const rows = TERMS.filter(item => {
        if (!q) return true;
        return item.de.toLowerCase().includes(q) || item.ru.toLowerCase().includes(q) || item.descDe.toLowerCase().includes(q) || item.descRu.toLowerCase().includes(q);
      });
      tbody.innerHTML = rows.map(item => `
        <tr>
          <td><strong>${item.de}</strong></td>
          <td>${item.ru}</td>
          <td>${lang === "ru" ? item.descRu : item.descDe}</td>
        </tr>
      `).join("");
    }

    function applyPageCopy() {
      applyDocumentLang();
      const lang = getLang();
      const isRu = lang === "ru";
      document.title = isRu
        ? "Словарь терминов ПДД Германии (DE ↔ RU) — Klasse B"
        : "Glossar: Wichtige Begriffe für die Theorieprüfung (DE ↔ RU)";
      document.getElementById("page-title").textContent = isRu
        ? "Словарь терминов ПДД Германии (DE ↔ RU)"
        : "Verkehrs-Glossar (DE ↔ RU)";
      document.getElementById("page-subtitle").textContent = isRu
        ? "24 главных немецких термина для экзамена и вождения с инструктором"
        : "24 wichtige Fachbegriffe für Theorieprüfung & Fahrstunden";
      document.getElementById("filter-label").textContent = isRu ? "Поиск термина:" : "Begriff suchen:";
      document.getElementById("glossar-filter").placeholder = isRu
        ? "Например: Vorfahrt, Schulterblick, Promille..."
        : "z. B. Vorfahrt, Schulterblick, Promille...";
      document.getElementById("th-desc").textContent = isRu ? "Пояснение" : "Erklärung";

      const back = document.getElementById("back-link");
      if (back) { back.textContent = `← ${t("allTopics")}`; back.href = localizedHref("index.html"); }
      const cv = document.getElementById("cta-vorfahrt");
      if (cv) { cv.textContent = isRu ? "Тема 1.3 Проезд перекрёстков" : "Vorfahrt & Vorrang üben"; cv.href = localizedHref("topic.html?id=1-3-vorfahrt-vorrang"); }
      const cz = document.getElementById("cta-zeichen");
      if (cz) { cz.textContent = isRu ? "Тема 1.4 Дорожные знаки" : "Verkehrszeichen üben"; cz.href = localizedHref("topic.html?id=1-4-verkehrszeichen"); }
      const cf = document.getElementById("cta-formulas");
      if (cf) { cf.textContent = isRu ? "Формулы и калькулятор" : "Formeln & Rechner"; cf.href = localizedHref("formulas.html"); }
      const fb = document.getElementById("footer-feedback-link");
      if (fb) fb.textContent = t("feedbackLinkText");

      applySiteDisclaimer();
      renderTerms(document.getElementById("glossar-filter")?.value || "");
    }

    document.addEventListener("DOMContentLoaded", () => {
      applyPageCopy();
      const langBtn = document.getElementById("lang-switch");
      if (langBtn) {
        langBtn.textContent = t("langSwitch");
        langBtn.title = t("langSwitchTitle");
        langBtn.addEventListener("click", () => setLang(getLang() === "ru" ? "de" : "ru"));
      }
      const filterInput = document.getElementById("glossar-filter");
      if (filterInput) {
        filterInput.addEventListener("input", () => renderTerms(filterInput.value));
      }
      const footerTime = document.getElementById("footer-time");
      if (footerTime && typeof bindTimeDisplay === "function") bindTimeDisplay(footerTime);
      const resetBtn = document.getElementById("time-reset-btn");
      if (resetBtn) {
        resetBtn.textContent = t("timeReset");
        resetBtn.addEventListener("click", () => {
          if (confirm(t("timeResetConfirm")) && typeof resetTrackedTime === "function") resetTrackedTime();
        });
      }
    });
  </script>
</body>
</html>
